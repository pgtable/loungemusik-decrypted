    height: 100%;

  .can-photo::after,
  .image-tile:not(.title-image)::after {
    content: "";
    position: absolute;
    inset: 0;
    background: #ff7900;
    opacity: 0;
    transition: opacity 0.18s linear;
    pointer-events: none;
  }
  @media (hover: hover) {

    .image-tile:not(.title-image):hover::after {
      opacity: 1;
    }
  }

    .can-photo::after,
    .image-tile:not(.title-image)::after {
      transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1);

    .can-photo.is-tapped::after,
    .image-tile:not(.title-image).is-tapped::after {
      opacity: 1;
      transition: opacity 0.18s linear;
    }

    background-repeat: no-repeat;

  }
  .waveform-tile {
    position: absolute;
    left: calc((var(--x) + var(--grid-offset-x)) * 1em);
    top: calc((var(--y) + var(--grid-offset-y)) * 1em);
    width: calc(var(--w) * 1em);
    height: calc(var(--h) * 1em);
    z-index: 5;
    
    overflow: visible;
    font: inherit;
    color: #000;
    background: transparent;
    --waveform-stroke-px: 4px;
  }
  .waveform-controls {
    position: absolute;
    left: 42em;
    top: 50%;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 10em;
    height: 34.5em;
    transform: translateY(-50%);
  }
  .waveform-control {
    position: relative;
    width: 27.6em;
    height: 32.2em;
    border: 0;
    padding: 0;
    cursor: pointer;
    font: inherit;
    background: transparent;
    color: inherit;
    border-radius: 0;
    -webkit-appearance: none;
    appearance: none;
  }
  .waveform-control:focus-visible {
    outline: 2em solid #000;
    outline-offset: 3em;
  }
  .waveform-icon,
  .waveform-icon::before,
  .waveform-icon::after {
    position: absolute;
    display: block;
    content: "";
  }
  .waveform-icon {
    inset: 0;
    transform: scale(1.15);
    transform-origin: center;
  }
  .waveform-prev .waveform-icon::before,
  .waveform-prev .waveform-icon::after,
  .waveform-next .waveform-icon::before,
  .waveform-next .waveform-icon::after {
    top: 50%;
    width: 0;
    height: 0;
    border-top: 6em solid transparent;
    border-bottom: 6em solid transparent;
    transform: translateY(-50%);
  }
  .waveform-prev .waveform-icon::before {
    left: 3em;
    border-right: 8em solid #000;
  }
  .waveform-prev .waveform-icon::after {
    left: 11em;
    border-right: 8em solid #000;
  }
  .waveform-next .waveform-icon::before {
    left: 5em;
    border-left: 8em solid #000;
  }
  .waveform-next .waveform-icon::after {
    left: 13em;
    border-left: 8em solid #000;
  }
  .waveform-play .waveform-icon::before {
    left: 8em;
    top: 50%;
    width: 0;
    height: 0;
    border-top: 6em solid transparent;
    border-bottom: 6em solid transparent;
    border-left: 8em solid #000;
    transform: translateY(-50%);
  }
  .waveform-tile.is-playing .waveform-play .waveform-icon::before,
  .waveform-tile.is-spinning-down .waveform-play .waveform-icon::before {
    left: 7em;
    top: 50%;
    width: 3.5em;
    height: 12em;
    border: 0;
    background: #000;
    box-shadow: 7em 0 0 #000;
    transform: translateY(-50%);
  }
  .waveform-display {
    position: absolute;
    left: 154em;
    top: 0;
    width: 278em;
    height: 100%;
    overflow: visible;
    --waveform-title-space: 15em;
  }
  .waveform-bars {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    bottom: var(--waveform-title-space);
    overflow: hidden;
    opacity: 1;
    transition: opacity 0.24s cubic-bezier(0.25, 1, 0.5, 1);
  }
  .waveform-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .waveform-tile.is-playing .waveform-bars,
  .waveform-tile.is-spinning-down .waveform-bars {
    opacity: 1;
  }
  .waveform-bar {
    position: relative;
    display: block;
    flex: 1 1 0;
    min-width: 2.2em;
    height: 100%;
  }
  .waveform-bar i,
  .waveform-bar b {
    position: absolute;
    display: block;
    background: #000;
  }
  .waveform-bar i {
    left: 0;
    width: 100%;
    bottom: 0;
    height: var(--bar-height, 0px);
  }
  .waveform-bar b {
    left: 0;
    width: 100%;
    top: var(--cap-top, 0px);
    height: var(--cap-height, 3px);
  }
  .waveform-tower {
    
    position: absolute;
    left: var(--tower-left, 35%);
    
    bottom: calc(var(--waveform-title-space) + var(--tower-rise, 0px));
    top: auto;
    height: var(--tower-height, 46px);
    width: auto;
    transform: translateX(-50%);
    pointer-events: none;
    opacity: 1;
    transition: opacity 0.24s cubic-bezier(0.25, 1, 0.5, 1);
  }
  .waveform-tower-svg {
    display: block;
    height: 100%;
    width: auto;
    
    clip-path: inset(0 0 46.68% 0);
  }
  .waveform-title {
    position: absolute;
    left: 0;
    right: 0;
    top: auto;
    bottom: 0.22em;
    z-index: 3;
    color: #000;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 10.5em;
    font-weight: 400;
    line-height: 1.15;
    letter-spacing: 0;
    text-align: left;
    opacity: 0;
    transition: opacity 0.24s cubic-bezier(0.25, 1, 0.5, 1);
    pointer-events: none;
  }
  .waveform-tile.is-loading .waveform-title,
  .waveform-tile.is-playing .waveform-title {
    opacity: 1;
  }
  .orange-reveal {
    z-index: 4;
    border: 0;
    padding: 0;
    cursor: pointer;
    font: inherit;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    -webkit-appearance: none;
    appearance: none;
  }
  .orange-reveal::after {
    content: "";
    position: absolute;
    inset: 0;
    background: #ff7900;
    opacity: 1;
    transition: opacity 0.18s linear;
  }
  @media (hover: hover) {
    .orange-reveal:hover::after,
    .orange-reveal:focus-visible::after {
      opacity: 0;
    }
  }
  @media (hover: none) {
    .orange-reveal::after {
      transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .orange-reveal.is-revealed::after {
      opacity: 0;
      transition: opacity 0.18s linear;
    }
  }
  .orange-reveal:focus-visible {
    outline: 1px solid #111;
    outline-offset: 2px;
  }
  .intro-cover {
    position: absolute;
    display: block;
    background: #fff;
    z-index: 10;
    pointer-events: none;
    opacity: 1;
    transition: opacity 0.08s linear;
  }
  .intro-cover.is-open { opacity: 0; }
  
  #stage.intro-active .waveform-tower { opacity: 0; }
  .footer {
    position: fixed;
    left: 32px;
    right: 32px;
    bottom: 32px;
    z-index: 20;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #333;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 15px;
    font-weight: 300;
    line-height: 1;
    letter-spacing: 0;
    pointer-events: none;
  }
  .footer a {
    color: inherit;
    text-decoration: none;
    pointer-events: auto;
  }
  .foot-sep { color: #ff7900; margin: 0 7px; pointer-events: none; }
  
  .foot-links a {
    display: inline-block;
    color: inherit;
    background: transparent;
    padding: 7px 14px;
    line-height: 1;
    transition: background-color 0.18s ease, color 0.18s ease;
  }
  .foot-links a:hover,
  .foot-links a:focus-visible {
    background: #ff7900;
    color: #fff;
  }
  
  .shop-link {
    position: fixed;
    left: 50%;
    bottom: 32px;
    transform: translateX(-50%);
    z-index: 30;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 18px;
    font-weight: 300;
    line-height: 1;
    letter-spacing: 0;
    color: #fff;
    text-decoration: none;
    background: #ff7900;
    padding: 8px 16px;
    transition: background-color 0.18s ease, color 0.18s ease;
    pointer-events: auto;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .shop-link:hover,
  .shop-link:focus-visible {
    background: #e56d00;
    color: #fff;
  }

  @media (max-width: 600px) {
    .stage {
      --stage-width: min(150vw, calc(100vh * 1.761606), 2106px);
      max-width: 1404px;
      top: 45%;
    }
    .footer { left: 3.63vw; right: 3.63vw; bottom: 28px; font-size: 9.9px; }
    .foot-links a { padding: 5px 0; }
    
    .shop-link {
      top: auto;
      bottom: 20vh;
      font-size: 13.2px;
      font-weight: 400;
      color: #fff;
      background: #ff7900;
      padding: 7.2px 19.2px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .intro-cover { display: none; }
  }

</style>

  var frequencyData = null;
  var decodePromises = {};
  var decodedBuffers = {};
  var audioBuffer = null;
  var spectrumLevels = [];
  var spectrumPeakCaps = [];
  var spectrumPeakHoldUntil = [];
  var waveformBarEls = [];
  var waveformBarLayoutKey = '';
  var waveformTitleLeftPx = -1;
  var playhead = 0;
  var transportActive = false;
  var currentRate = 0;
  var visualPower = 0;
  var lastWaveFrame = 0;
  var rateRampFrom = 0;
  var rateRampTo = 0;
  var rateRampStart = 0;
  var rateRampDuration = 1;
  var stopTimer = null;
  var manualStop = false;
  var wasPlayingBeforePageHidden = false;
  var resumeAttemptTimer = null;
  var intendPlaying = false;

  ['contextmenu', 'dragstart', 'selectstart', 'copy', 'cut'].forEach(function(evt) {
    document.addEventListener(evt, function(e) {
      e.preventDefault();
    }, { passive: false });
  });
  document.addEventListener('keydown', function(e){
    var k = (e.key || '').toLowerCase();
    if (e.keyCode === 123) { e.preventDefault(); return; }
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && (k==='i'||k==='j'||k==='c')) { e.preventDefault(); return; }
    if ((e.ctrlKey || e.metaKey) && (k==='u'||k==='s'||k==='p')) { e.preventDefault(); return; }
  }, { capture: true });

  function currentTrack() {
    return tracks[currentTrackIndex] || tracks[0];
  }

  function updateTrackTitle() {
    var track = currentTrack();
    if (waveformTitle && track) waveformTitle.textContent = track.artist + ' - ' + track.title;
  }

  function ensureContext() {
    if (!AudioContextCtor) return null;
    if (audioCtx && audioCtx.state === 'closed') {
      audioCtx = null; gainNode = null; sourceNode = null; analyserNode = null; frequencyData = null;
    }
    if (!audioCtx) {
      audioCtx = new AudioContextCtor();
      gainNode = audioCtx.createGain();
      gainNode.gain.value = 0;
      gainNode.connect(audioCtx.destination);
      if (audioCtx.addEventListener) {
        audioCtx.addEventListener('statechange', function() {
          if (audioCtx && audioCtx.state !== 'running' && intendPlaying) {
            audioCtx.resume().catch(function() {});
          }
        });
      }
    }
    return audioCtx;
  }

  function unlockInGesture() {
    var su = document.getElementById('silent-unlock');
    if (su) {
      try { su.muted = false; su.volume = 1; } catch (e) {}
      try { var pp = su.play(); if (pp && pp.catch) pp.catch(function () {}); } catch (e) {}
    }
    var ctx = ensureContext();
    if (!ctx) return;
    if (ctx.state !== 'running') { try { ctx.resume(); } catch (e) {} }
    try {
      var b = ctx.createBuffer(1, 1, 22050);
      var s = ctx.createBufferSource();
      s.buffer = b;
      s.connect(ctx.destination);
      s.start(0);
    } catch (e) {}
  }

  function ensureRunning() {
    var ctx = ensureContext();
    if (!ctx) return Promise.resolve(false);
    if (ctx.state === 'running') return Promise.resolve(true);
    try { ctx.resume(); } catch (e) {}
    return new Promise(function(resolve) {
      var tries = 0;
      var iv = window.setInterval(function() {
        tries += 1;
        if (!audioCtx) { window.clearInterval(iv); resolve(false); return; }
        if (audioCtx.state === 'running') { window.clearInterval(iv); resolve(true); return; }
        if (tries > 12) { window.clearInterval(iv); resolve(false); return; }
        try { audioCtx.resume(); } catch (e) {}
      }, 50);
    });
  }

  function recreateContext() {
    try { if (audioCtx) audioCtx.close(); } catch (e) {}
    audioCtx = null; gainNode = null; sourceNode = null; analyserNode = null; frequencyData = null;
    decodedBuffers = {}; decodePromises = {}; audioBuffer = null;
    ensureContext();
  }

  function ensureAudio(trackIndex) {
    trackIndex = typeof trackIndex === 'number' ? trackIndex : currentTrackIndex;
    var track = tracks[trackIndex];
    if (!AudioContextCtor) return Promise.reject(new Error('AudioContext nicht verfuegbar'));
    if (!track) return Promise.reject(new Error('Track nicht verfuegbar'));
    ensureContext();
    if (decodedBuffers[trackIndex]) {
      audioBuffer = decodedBuffers[trackIndex];
      return Promise.resolve(decodedBuffers[trackIndex]);
    }
    if (!decodePromises[trackIndex]) {
      decodePromises[trackIndex] = fetch(track.src, { cache: 'force-cache', credentials: 'same-origin' })
        .then(function(response) {
          if (!response.ok) throw new Error('Track konnte nicht geladen werden');
          return response.arrayBuffer();
        })
        .then(function(arrayBuffer) {
          return decryptMedia(arrayBuffer).then(function(pt){ return audioCtx.decodeAudioData(pt); });
        })
        .then(function(buffer) {
          decodedBuffers[trackIndex] = buffer;
          if (trackIndex === currentTrackIndex) audioBuffer = buffer;
          return buffer;
        })
        .catch(function(err) {
          delete decodePromises[trackIndex];
          throw err;
        });
    }
    return decodePromises[trackIndex].then(function(buffer) {
      if (trackIndex === currentTrackIndex) {
        audioBuffer = buffer;
      }
      return buffer;
    });
  }

  function updatePlayLabel(isPlaying) {
    if (waveformPlay) waveformPlay.setAttribute('aria-label', isPlaying ? 'Track pausieren' : 'Track starten');
  }

  function setRateRamp(target, durationMs) {
    rateRampFrom = currentRate;
    rateRampTo = target;
    rateRampStart = performance.now();
    rateRampDuration = Math.max(1, durationMs);
  }

  function stopSourceNode(resetToStart) {
    if (stopTimer) window.clearTimeout(stopTimer);
    stopTimer = null;
    if (sourceNode) {
      manualStop = true;
      try { sourceNode.stop(); } catch (e) {}
      try { sourceNode.disconnect(); } catch (e) {}
      sourceNode = null;
      window.setTimeout(function() { manualStop = false; }, 0);
    }
    if (analyserNode) {
      try { analyserNode.disconnect(); } catch (e) {}
      analyserNode = null;
    }
    frequencyData = null;
    transportActive = false;
    currentRate = 0;
    if (resetToStart) playhead = 0;
    waveformTile.classList.remove('is-playing', 'is-spinning-down', 'is-loading');
    updatePlayLabel(false);
  }

  function finishTrack() {
    intendPlaying = false;
    stopSourceNode(true);
    setRateRamp(0, 700);
  }

  function startTrack(options) {
    options = options || {};
    intendPlaying = true;
    if (waveformTile.classList.contains('is-spinning-down')) return;
    waveformTile.classList.add('is-loading');
    prepareAndPlay(currentTrackIndex, options, false);
  }

  function prepareAndPlay(trackIndex, options, isRetry) {
    ensureAudio(trackIndex).then(function(buffer) {
      return ensureRunning().then(function(running) { return { buffer: buffer, running: running }; });
    }).then(function(res) {
      if (trackIndex !== currentTrackIndex || !intendPlaying) {
        waveformTile.classList.remove('is-loading');
        return;
      }
      if (!res.running) {
        if (!isRetry) {
          recreateContext();
          prepareAndPlay(currentTrackIndex, options, true);
        } else {
          waveformTile.classList.remove('is-loading');
          updatePlayLabel(false);
        }
        return;
      }
      doStart(res.buffer, options);
    }).catch(function() {
      waveformTile.classList.remove('is-loading', 'is-spinning-down', 'is-playing');
      updatePlayLabel(false);
    });
  }

  function doStart(buffer, options) {
    options = options || {};
    if (sourceNode) stopSourceNode(false);
    if (playhead >= buffer.duration - 0.05) playhead = 0;
    var now = audioCtx.currentTime;
    var spinMs = options.fast ? 90 : 1250;
    var startRate = options.fast ? 1 : 0.08;
    sourceNode = audioCtx.createBufferSource();
    sourceNode.buffer = buffer;
    sourceNode.loop = true;
    sourceNode.playbackRate.setValueAtTime(startRate, now);
    sourceNode.playbackRate.linearRampToValueAtTime(1, now + spinMs / 1000);
    analyserNode = audioCtx.createAnalyser();
    analyserNode.fftSize = 2048;
    analyserNode.minDecibels = -90;
    analyserNode.maxDecibels = -18;
    analyserNode.smoothingTimeConstant = 0.88;
    frequencyData = new Uint8Array(analyserNode.frequencyBinCount);
    sourceNode.connect(analyserNode);
    analyserNode.connect(gainNode);
    var activeSourceNode = sourceNode;
    sourceNode.onended = function() {
      if (sourceNode !== activeSourceNode) return;
      if (manualStop) return;
      if (document.hidden) return;
      if (transportActive) finishTrack();
    };
    gainNode.gain.cancelScheduledValues(now);
    gainNode.gain.setValueAtTime(0.0001, now);
    gainNode.gain.linearRampToValueAtTime(1, now + spinMs / 1000);
    sourceNode.start(now, Math.max(0, playhead));
    transportActive = true;
    currentRate = startRate;
    setRateRamp(1, spinMs);
    waveformTile.classList.remove('is-loading', 'is-spinning-down');
    waveformTile.classList.add('is-playing');
    updatePlayLabel(true);
  }

  function pauseTrack() {
    if (!sourceNode || !audioCtx || waveformTile.classList.contains('is-spinning-down')) return;
    intendPlaying = false;
    var now = audioCtx.currentTime;
    var spinMs = 1250;
    sourceNode.playbackRate.cancelScheduledValues(now);
    sourceNode.playbackRate.setValueAtTime(Math.max(0.08, currentRate), now);
    sourceNode.playbackRate.linearRampToValueAtTime(0.04, now + spinMs / 1000);
    gainNode.gain.cancelScheduledValues(now);
    gainNode.gain.setValueAtTime(gainNode.gain.value || 1, now);
    gainNode.gain.linearRampToValueAtTime(0.0001, now + spinMs / 1000);
    setRateRamp(0, spinMs);
    waveformTile.classList.remove('is-playing');
    waveformTile.classList.add('is-spinning-down');
    updatePlayLabel(false);
    stopTimer = window.setTimeout(function() {
      stopSourceNode(false);
    }, spinMs + 80);
  }

  function toggleTrack() {
    var live = intendPlaying && sourceNode && transportActive
      && audioCtx && audioCtx.state === 'running'
      && !waveformTile.classList.contains('is-spinning-down');
    if (live) {
      pauseTrack();
    } else {
      startTrack((transportActive || waveformTile.classList.contains('is-playing')) ? { fast: true } : {});
    }
  }

  function changeTrack(direction) {
    if (!tracks.length) return;
    var wasActive = transportActive || waveformTile.classList.contains('is-playing') || waveformTile.classList.contains('is-loading');
    stopSourceNode(true);
    currentTrackIndex = (currentTrackIndex + direction + tracks.length) % tracks.length;
    audioBuffer = decodedBuffers[currentTrackIndex] || null;
    spectrumLevels = [];
    spectrumPeakCaps = [];
    spectrumPeakHoldUntil = [];
    updateTrackTitle();
    setRateRamp(0, 160);
    if (wasActive) startTrack({ fast: true });
  }

  function tryResumeAfterReturn() {
    if (!wasPlayingBeforePageHidden) return;
    ensureRunning().then(function(running) {
      if (running && wasPlayingBeforePageHidden) {
        wasPlayingBeforePageHidden = false;
        startTrack({ fast: true });
      }
    }).catch(function() {});
  }

  function updateWaveTransport(now) {
    if (!lastWaveFrame) lastWaveFrame = now;
    var dt = Math.min(0.05, Math.max(0, (now - lastWaveFrame) / 1000));
    lastWaveFrame = now;
    var rampProgress = Math.min(1, (now - rateRampStart) / rateRampDuration);
    var eased = 1 - Math.pow(1 - rampProgress, 3);
    currentRate = rateRampFrom + (rateRampTo - rateRampFrom) * eased;
    if (transportActive && audioBuffer) {
      playhead += dt * Math.max(0, currentRate);
      if (playhead >= audioBuffer.duration) playhead = playhead % audioBuffer.duration;
    }
    var targetPower = (transportActive || waveformTile.classList.contains('is-spinning-down')) ? Math.min(1, Math.max(0, currentRate)) : 0;
    visualPower += (targetPower - visualPower) * Math.min(1, dt * 7.5);
    return dt;
  }

  function readSpectrumBand(index, count) {
    if (!frequencyData || !audioCtx) return 0;
    var nyquist = audioCtx.sampleRate * 0.5;
    var minHz = 45;
    var maxHz = Math.min(15000, nyquist * 0.86);
    var fromHz = minHz * Math.pow(maxHz / minHz, index / count);
    var toHz = minHz * Math.pow(maxHz / minHz, (index + 1) / count);
    var startBin = Math.max(0, Math.floor(fromHz / nyquist * frequencyData.length));
    var endBin = Math.max(startBin + 1, Math.floor(toHz / nyquist * frequencyData.length));
    endBin = Math.min(frequencyData.length, endBin);
    var sum = 0;
    var squared = 0;
    var peak = 0;
    for (var bin = startBin; bin < endBin; bin += 1) {
      var value = frequencyData[bin] / 255;
      sum += value;
      squared += value * value;
      if (value > peak) peak = value;
    }
    var avg = sum / Math.max(1, endBin - startBin);
    var rms = Math.sqrt(squared / Math.max(1, endBin - startBin));
    var mixed = avg * 0.7 + rms * 0.27 + peak * 0.03;
    var floor = 0.1;
    var ceiling = 0.74;
    mixed = Math.max(0, (mixed - floor) / Math.max(0.1, ceiling - floor));
    var position = index / Math.max(1, count - 1);
    var edge = Math.abs(position - 0.5) * 2;
    var lowsHighsBoost = 0.78 + Math.pow(edge, 1.35) * 0.36;
    if (position < 0.18) lowsHighsBoost += 0.1;
    if (position > 0.70) lowsHighsBoost += 0.08;
    return Math.min(1, Math.pow(Math.max(0, mixed * lowsHighsBoost), 0.95) * 0.8);
  }

  function referenceSpectrumProfile(index, count) {
    var profile = [
      0.84, 0.34, 0.48, 0.64, 0.78, 0.84, 0.80, 0.76, 0.72, 0.68, 0.61,
      0.47, 0.34, 0.42, 0.70, 0.30, 0.40, 0.49, 0.45, 0.32, 0.20, 0.12,
      0.22, 0.38, 0.57, 0.68, 0.76, 0.70, 0.60, 0.58, 0.36, 0.45, 0.64,
      0.82, 0.66, 0.51, 0.64, 0.63, 0.70, 0.67, 0.66, 0.62, 0.70, 0.86
    ];
    var scaled = index / Math.max(1, count - 1) * (profile.length - 1);
    var left = Math.floor(scaled);
    var right = Math.min(profile.length - 1, left + 1);
    var amount = scaled - left;
    return profile[left] + (profile[right] - profile[left]) * amount;
  }

  function drawWaveform(now) {
    window.requestAnimationFrame(drawWaveform);
    if (!waveformBars || !waveformTile) return;
    var rect = waveformBars.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    var width = rect.width;
    var height = rect.height;
    var frameNow = now || performance.now();
    var dt = updateWaveTransport(frameNow);

    var barCount = 32;
    if (analyserNode && frequencyData) analyserNode.getByteFrequencyData(frequencyData);
    while (spectrumLevels.length < barCount) spectrumLevels.push(0);
    while (spectrumPeakCaps.length < barCount) spectrumPeakCaps.push(0);
    while (spectrumPeakHoldUntil.length < barCount) spectrumPeakHoldUntil.push(0);
    if (!waveformCtx) return;

    var barDpr = window.devicePixelRatio || 1;

    var cw = Math.round(width * barDpr);
    var chh = Math.round(height * barDpr);
    var sizeKey = cw + 'x' + chh;
    if (sizeKey !== waveformBarLayoutKey) {
      waveformBarLayoutKey = sizeKey;
      waveformCanvas.width = cw;
      waveformCanvas.height = chh;
      waveformCanvas.style.width = (cw / barDpr) + 'px';
      waveformCanvas.style.height = (chh / barDpr) + 'px';
    }

    var pitchDev = Math.max(2, Math.floor(cw / barCount));
    var gapDev = Math.max(2, Math.round(pitchDev * 0.3));
    var barWDev = Math.max(1, pitchDev - gapDev);
    var blockDev = barCount * barWDev + (barCount - 1) * gapDev;
    var startDev = Math.max(0, Math.round((cw - blockDev) / 2));

    if (waveformTitle) {
      var titleLeftPx = startDev / barDpr;
      if (Math.abs(titleLeftPx - waveformTitleLeftPx) > 0.01) {
        waveformTitle.style.left = titleLeftPx + 'px';
        waveformTitleLeftPx = titleLeftPx;
      }
    }

    var attack = 1 - Math.exp(-dt * 12);
    var release = 1 - Math.exp(-dt * 7.4);
    var peakFall = dt * 0.5;
    var towerX = width * 0.35;
    var towerIndex = Math.max(0, Math.min(barCount - 1, Math.round((towerX / Math.max(1, width)) * (barCount - 1))));
    var towerEl = waveformTile.querySelector('.waveform-tower');

    var slotWidth = barWDev / barDpr;
    var towerHeightDev = barWDev * 20;
    var towerRiseDev = barWDev;
    var barsPlaying = waveformTile.classList.contains('is-playing') || waveformTile.classList.contains('is-spinning-down');
    if (towerEl) {
      var slotCenterDev = startDev + towerIndex * pitchDev + barWDev / 2;
      towerEl.style.setProperty('--tower-left', (slotCenterDev / barDpr) + 'px');
      towerEl.style.setProperty('--tower-height', (slotWidth * 20) + 'px');
      towerEl.style.setProperty('--tower-rise', (towerRiseDev / barDpr) + 'px');
      var svgEl = towerEl.querySelector('.waveform-tower-svg');
      if (svgEl) svgEl.style.clipPath = 'inset(0 0 46.68% 0)';
    }
    var capHeight = height * 0.02;
    var capHover = height * 0.06;
    var capHeightDev = Math.max(1, Math.round(capHeight * barDpr));

    waveformCtx.clearRect(0, 0, cw, chh);
    waveformCtx.fillStyle = '#000';

    for (var i = 0; i < barCount; i += 1) {
      var referenceLevel = referenceSpectrumProfile(i, barCount);
      var liveLevel = readSpectrumBand(i, barCount);
      if (i <= 4) {
        var bassGate = 0.4;
        liveLevel = liveLevel > bassGate ? (liveLevel - bassGate) / (1 - bassGate) : 0;
        referenceLevel *= 0.6;
      }
      var isTowerSlot = i === towerIndex;
      var targetLevel = Math.min(0.88, referenceLevel * (0.26 + liveLevel * 0.22) + liveLevel * 0.70) * visualPower;
      var currentLevel = spectrumLevels[i] || 0;
      currentLevel += (targetLevel - currentLevel) * (targetLevel > currentLevel ? attack : release);
      spectrumLevels[i] = currentLevel;

      var storedPeak = spectrumPeakCaps[i] || 0;
      if (currentLevel >= storedPeak) {
        spectrumPeakCaps[i] = currentLevel;
        spectrumPeakHoldUntil[i] = frameNow + 520;
      } else if (frameNow < (spectrumPeakHoldUntil[i] || 0)) {
        spectrumPeakCaps[i] = storedPeak;
      } else {
        spectrumPeakCaps[i] = Math.max(currentLevel, storedPeak - peakFall);
      }

      if (isTowerSlot) {
        var shaftXDev = startDev + i * pitchDev;
        var shaftTopY = Math.max(0, Math.round(chh - 0.4668 * towerHeightDev - towerRiseDev));
        if (chh - shaftTopY > 0) waveformCtx.fillRect(shaftXDev, shaftTopY, barWDev, chh - shaftTopY);
        continue;
      }

      var xDev = startDev + i * pitchDev;
      var barHeight = currentLevel > 0.01 ? height * (0.08 + currentLevel * 0.62) : 0;
      var barHeightDev = Math.round(barHeight * barDpr);
      if (barHeightDev > 0) {
        waveformCtx.fillRect(xDev, chh - barHeightDev, barWDev, barHeightDev);
      }
      var capLevel = spectrumPeakCaps[i] || 0;
      var capBarHeight = capLevel > 0.01 ? height * (0.08 + capLevel * 0.62) : 0;
      var capTop = Math.max(0, height - capBarHeight - capHeight - capHover);
      if (capLevel > 0.01) {
        waveformCtx.fillRect(xDev, Math.round(capTop * barDpr), barWDev, capHeightDev);
      }
    }
  }

  if (waveformTile && waveformBars) {
    updateTrackTitle();
    if (waveformPlay) {
      waveformPlay.addEventListener('click', function(e) {
        e.preventDefault();
        unlockInGesture();
        toggleTrack();
      });
    }
    if (waveformPrev) {
      waveformPrev.addEventListener('click', function(e) {
        e.preventDefault();
        unlockInGesture();
        changeTrack(-1);
      });
    }
    if (waveformNext) {
      waveformNext.addEventListener('click', function(e) {
        e.preventDefault();
        unlockInGesture();
        changeTrack(1);
      });
    }
    document.addEventListener('visibilitychange', function() {
      if (document.hidden) {
        wasPlayingBeforePageHidden = intendPlaying || transportActive || waveformTile.classList.contains('is-playing');
        if (sourceNode) stopSourceNode(false);
        waveformTile.classList.remove('is-playing', 'is-spinning-down', 'is-loading');
        updatePlayLabel(false);
      } else {
        tryResumeAfterReturn();
      }
    });
    window.addEventListener('pageshow', tryResumeAfterReturn);
    window.addEventListener('focus', tryResumeAfterReturn);
    document.addEventListener('pointerdown', function() {
      if (!audioCtx || audioCtx.state !== 'running') unlockInGesture();
    }, { capture: true, passive: true });
    window.requestAnimationFrame(drawWaveform);
  }

  function makeCover(tile) {
    var cover = document.createElement('span');
    cover.className = 'intro-cover';
    cover.dataset.newest = tile.dataset.newest || '';
    cover.style.left = 'calc((' + tile.style.getPropertyValue('--x') + ' + var(--grid-offset-x)) * 1em - 3em)';
    cover.style.top = 'calc((' + tile.style.getPropertyValue('--y') + ' + var(--grid-offset-y)) * 1em - 3em)';
    cover.style.width = 'calc(' + tile.style.getPropertyValue('--w') + 'em + 6em)';
    cover.style.height = 'calc(' + tile.style.getPropertyValue('--h') + 'em + 6em)';
    stage.appendChild(cover);
    return cover;
  }

  function shuffle(items) {
    var shuffled = items.slice();
    for (var index = shuffled.length - 1; index > 0; index -= 1) {
      var swapIndex = Math.floor(Math.random() * (index + 1));
      var current = shuffled[index];
      shuffled[index] = shuffled[swapIndex];
      shuffled[swapIndex] = current;
    }
    return shuffled;
  }

  function runIntroRandomized() {
    var extraEls = [];
    var footerEl = document.querySelector('.footer');
    if (footerEl) {
      Array.prototype.forEach.call(footerEl.children, function(child) { extraEls.push(child); });
    }
    var shopEl = document.querySelector('.shop-link');
    if (shopEl) { extraEls.push(shopEl); }

    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      return;
    }

    extraEls.forEach(function(el) {
      el.style.opacity = '0';
      var fade = 'opacity 0.42s cubic-bezier(0.25, 1, 0.5, 1)';
      if (el === shopEl) { fade += ', background-color 0.18s ease, color 0.18s ease'; }
      el.style.transition = fade;
    });

    var covers = tiles.map(makeCover);
    var actions = covers.map(function(cover) {
      return function() {
        cover.classList.add('is-open');
        window.setTimeout(function() { cover.remove(); }, 120);
      };
    });
    extraEls.forEach(function(el) {
      actions.push(function() { el.style.opacity = '1'; });
    });

    var ordered = shuffle(actions);

    if (waveformTile) {
      var waveformCover = makeCover(waveformTile);
      stage.classList.add('intro-active');
      ordered.push(function() {
        waveformCover.classList.add('is-open');
        stage.classList.remove('intro-active');
        window.setTimeout(function() { waveformCover.remove(); }, 120);
      });
    }

    ordered.forEach(function(action, index) {
      window.setTimeout(action, index * 58);
    });
  }

  var canHover = window.matchMedia && window.matchMedia('(hover: hover)').matches;
  if (!canHover) {
    tiles.forEach(function(tile) {
      var isReveal = tile.classList.contains('orange-reveal');
      var activeClass = isReveal ? 'is-revealed' : 'is-tapped';
      var holdMs = 3000;
      var tapTimer = null;
      tile.addEventListener('pointerdown', function() {
        tile.classList.add(activeClass);
        if (tapTimer) { window.clearTimeout(tapTimer); }
        tapTimer = window.setTimeout(function() {
          tile.classList.remove(activeClass);
        }, holdMs);
      });
    });
  }

  runIntroRandomized();
</script>
</body>
</html>
